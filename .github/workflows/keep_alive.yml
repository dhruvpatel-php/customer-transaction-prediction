name: Streamlit App Keep-Alive

on:
  schedule:
    # Runs every 12 hours (at 00:00 and 12:00 UTC) to prevent Streamlit Cloud sleep mode
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

concurrency:
  group: keep-alive-streamlit
  cancel-in-progress: true

jobs:
  keep-alive:
    name: Ping & Wake Up Streamlit App
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Headless Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit App & Reset Inactivity Timer
        run: |
          python scripts/keep_alive.py
